<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KTS Singen – Spielplan 2027/28</title>
<style>
  :root{
    --akzent:#7e3167; --akzent-hell:#f4eef3; --gruen:#2e7d32; --gruen-hell:#e6f3e6;
    --gelb:#b26a00; --gelb-hell:#fdf3e0; --rot:#b3261e; --rot-hell:#fbeaea;
    --grau:#6e6870; --grau-hell:#ece6eb; --rand:#d9d2dc; --text:#1d1a1e;
    --gold:#ffcc66;
  }
  *{box-sizing:border-box;}
  body{font-family:'Segoe UI',system-ui,Arial,sans-serif;margin:0;background:#fbf9fa;color:var(--text);font-size:16px;}
  header{background:var(--text);color:#fff;padding:14px 24px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;border-bottom:3px solid var(--gold);}
  header h1{font-size:20px;margin:0;font-weight:600;}
  header .saison{color:var(--gold);font-size:14px;}
  nav{display:flex;background:#fff;border-bottom:2px solid var(--rand);padding:0 12px;flex-wrap:wrap;position:sticky;top:0;z-index:10;}
  nav button{border:none;background:none;padding:14px 18px;font-size:16px;cursor:pointer;color:var(--grau);border-bottom:3px solid transparent;font-weight:500;}
  nav button.aktiv{color:var(--akzent);border-bottom-color:var(--akzent);font-weight:700;}
  main{padding:20px;max-width:1250px;margin:0 auto;}
  h2{font-size:20px;margin:8px 0 14px;}
  h3{font-size:16px;margin:16px 0 8px;}
  .karten{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:20px;}
  .karte{background:#fff;border:1px solid var(--rand);border-radius:10px;padding:14px 16px;}
  .karte .wert{font-size:26px;font-weight:700;}
  .karte .label{font-size:13px;color:var(--grau);margin-top:2px;}
  table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--rand);border-radius:8px;overflow:hidden;}
  th{background:var(--akzent-hell);text-align:left;padding:10px;font-size:13px;color:var(--akzent);text-transform:uppercase;letter-spacing:.3px;}
  td{padding:10px;border-top:1px solid var(--rand);font-size:15px;vertical-align:top;}
  tr.klickbar{cursor:pointer;}
  tr.klickbar:hover{background:var(--akzent-hell);}
  tr.jahrtrenner td{background:var(--text);color:var(--gold);font-weight:700;font-size:14px;letter-spacing:1px;padding:7px 10px;border-top:none;}
  .pille{display:inline-block;padding:3px 10px;border-radius:12px;font-size:13px;font-weight:600;white-space:nowrap;}
  .sgebucht{background:var(--gruen-hell);color:var(--gruen);}
  .soptioniert{background:var(--akzent-hell);color:var(--akzent);}
  .sangefragt{background:var(--gelb-hell);color:var(--gelb);}
  .sIdee{background:var(--grau-hell);color:var(--grau);}
  .sabgesagt{background:var(--rot-hell);color:var(--rot);text-decoration:line-through;}
  .sohne{background:var(--gelb-hell);color:var(--gelb);border:1px dashed var(--gelb);}
  tr.zAbgesagt td{background:var(--grau-hell);opacity:.55;}
  button.aktion{background:var(--akzent);color:#fff;border:none;border-radius:8px;padding:10px 16px;font-size:15px;cursor:pointer;font-weight:600;}
  button.aktion.sekundaer{background:#fff;color:var(--akzent);border:2px solid var(--akzent);}
  button.aktion.klein{padding:6px 10px;font-size:13px;}
  button.aktion:hover{opacity:.9;}
  .leiste{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px;}
  select,input[type=text],input[type=number],input[type=date],textarea{padding:9px;border:1px solid var(--rand);border-radius:8px;font-size:15px;font-family:inherit;background:#fff;}
  dialog{border:none;border-radius:12px;padding:0;max-width:680px;width:94%;box-shadow:0 10px 40px rgba(0,0,0,.25);}
  dialog::backdrop{background:rgba(0,0,0,.35);}
  .dkopf{background:var(--akzent);color:#fff;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;}
  .dkopf h3{margin:0;font-size:17px;}
  .dkopf button{background:none;border:none;color:#fff;font-size:22px;cursor:pointer;}
  .dinhalt{padding:18px 20px;max-height:78vh;overflow-y:auto;}
  .feld{margin-bottom:12px;}
  .feld label{display:block;font-size:13px;font-weight:600;color:var(--grau);margin-bottom:4px;}
  .feld input,.feld select,.feld textarea{width:100%;}
  .zweispaltig{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .nkraster{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
  .nkraster .feld label{font-size:12px;}
  .hinweis{background:var(--akzent-hell);border-left:4px solid var(--akzent);padding:12px 14px;border-radius:0 8px 8px 0;margin:12px 0;font-size:15px;line-height:1.5;}
  .warnbox{background:var(--gelb-hell);border-left:4px solid var(--gelb);padding:12px 14px;border-radius:0 8px 8px 0;margin:12px 0;font-size:15px;line-height:1.5;}
  .rotbox{background:var(--rot-hell);border-left:4px solid var(--rot);padding:12px 14px;border-radius:0 8px 8px 0;margin:12px 0;font-size:15px;line-height:1.5;font-weight:600;}
  .kal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
  .kalwt{font-size:12px;font-weight:700;color:var(--akzent);text-align:center;padding:4px 0;}
  .kaltag{background:#fff;border:1px solid var(--rand);border-radius:6px;min-height:88px;padding:4px;font-size:12px;}
  .kaltag.kalleer{background:transparent;border:none;min-height:0;}
  .kaltag.kalheute{outline:2px solid var(--akzent);}
  .kaltag.kalkollision{outline:2px solid var(--rot);}
  .kalnum{font-weight:700;color:var(--grau);font-size:11px;}
  .kalitem{border-radius:4px;padding:2px 4px;margin-top:3px;cursor:pointer;font-size:11px;line-height:1.25;overflow:hidden;}
  .fussnote{color:var(--grau);font-size:13px;margin-top:6px;}
  .budgetfeld{width:110px;font-size:20px;font-weight:700;border:1px dashed var(--rand);padding:2px 6px;}
  .balkenzeile{display:flex;align-items:center;gap:10px;margin:6px 0;}
  .balkenzeile .bname{width:150px;font-size:14px;}
  .balken{flex:1;background:var(--grau-hell);border-radius:6px;height:22px;position:relative;overflow:hidden;}
  .balken > div{height:100%;background:var(--akzent);border-radius:6px;}
  .balkenzeile .bwert{width:130px;font-size:14px;text-align:right;}
  .plus{color:var(--rot);font-weight:600;}
  .minus{color:var(--gruen);font-weight:600;}
  .akarte{background:#fff;border:1px solid var(--rand);border-radius:10px;padding:16px 18px;margin-bottom:14px;}
  .akopf{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:6px;}
  .score{display:inline-flex;align-items:center;justify-content:center;min-width:46px;height:46px;border-radius:50%;font-weight:800;font-size:16px;color:#fff;}
  .prioA{background:var(--gruen);} .prioB{background:var(--akzent);} .prioC{background:var(--gelb);} .prioD{background:var(--rot);}
  .rolle{background:var(--text);color:var(--gold);padding:3px 10px;border-radius:12px;font-size:12px;font-weight:700;letter-spacing:.5px;}
  .atext{font-size:14.5px;line-height:1.55;color:#3a353d;margin:8px 0;}
  .araster{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:10px;}
  .afeld{background:var(--grau-hell);border-radius:8px;padding:8px 10px;font-size:13px;}
  .afeld b{display:block;font-size:15px;}
  .afeld input{width:70px;padding:3px 6px;font-size:14px;border:1px dashed var(--rand);border-radius:6px;}
  .preiszeile input{width:56px;padding:3px 4px;font-size:14px;border:1px dashed var(--rand);border-radius:6px;}
  .ergGewinn{color:var(--gruen);font-weight:700;} .ergVerlust{color:var(--rot);font-weight:700;}
  @media print{ nav,header .werkzeuge,button.aktion{display:none!important;} body{background:#fff;} }
</style>
</head>
<body>
<header>

<main id="inhalt"></main>

  <div class="dinhalt">
    <input type="hidden" id="vdId">

      <div class="feld"><label>Datum</label><input type="date" id="vdDatum"></div>
      <div class="feld"><label>Status</label><select id="vdStatus">

        <option>optioniert</option><option>gebucht</option><option>abgesagt</option>

      <div class="feld"><label>Sparte</label><select id="vdSparte"></select></div>

    </div>
    <div class="feld"><label>Gage (€)</label><input type="number" id="vdGage" min="0" step="100"></div>
    <h3 style="margin:14px 0 8px;">Nebenkosten (€)</h3>
    <div class="nkraster" id="vdNkRaster"></div>

    <div class="fussnote" id="vdSumme" style="margin-bottom:10px;"></div>

    <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:8px;">
      <button class="aktion sekundaer" id="vdLoeschen" onclick="vaLoeschen()">Löschen</button>
      <button class="aktion" onclick="vaSpeichern()">Speichern</button>
    </div>
  </div>
</dialog>

<script>
/* ================= STAMMDATEN ================= */
const SPARTEN = ["Schauspiel","Komödie","Musik/Show","Symphoniekonzert","Kammerkonzert","Kindertheater","Sonstiges"];
const STATI = ["gebucht","optioniert","angefragt","Idee","abgesagt"];
const NK_ARTEN = [["tantiemen","Tantiemen"],["transfer","Transfer"],["uebernachtung","Übernachtung"],["catering","Catering"],["gema","Gema"],["sozialkasse","Sozialkasse"],["sonderabgabe","Sonderabgabe"]];
const nkLeer = () => ({tantiemen:0,transfer:0,uebernachtung:0,catering:0,gema:0,sozialkasse:0,sonderabgabe:0});

/* Vorbefüllt aus KTS_Spielplan_27_28 Planung#3.xlsx – bisherige Nebenkosten als Pauschale (nkAlt) */
const START_VA = [
 {vid:1, datum:"2027-10-02",titel:"1. Symphoniekonzert",sparte:"Symphoniekonzert",agentur:"",status:"optioniert",gage:10000,nk:nkLeer(),nkAlt:1000,anmerkung:""},
 {vid:3, datum:"2027-10-21",titel:"Kleine Eheverbrechen",sparte:"Komödie",agentur:"Berlin",status:"optioniert",gage:10000,nk:nkLeer(),nkAlt:2500,anmerkung:""},
 {vid:4, datum:"2027-10-28",titel:"Der Sohn",sparte:"Schauspiel",agentur:"Tourerleben",status:"optioniert",gage:9000,nk:nkLeer(),nkAlt:2000,anmerkung:""},
 {vid:5, datum:"2027-11-27",titel:"Fitzek",sparte:"Schauspiel",agentur:"Showslot",status:"gebucht",gage:25000,nk:nkLeer(),nkAlt:10000,anmerkung:""},
 {vid:6, datum:"2027-11-27",titel:"1. Kammerkonzert",sparte:"Kammerkonzert",agentur:"",status:"Idee",gage:6000,nk:nkLeer(),nkAlt:2000,anmerkung:"gleicher Tag wie Fitzek – Überschneidung prüfen"},
 {vid:7, datum:"2027-12-04",titel:"Drei Männer unter'm Tannenbaum",sparte:"Komödie",agentur:"Komödie am Altstadtmarkt",status:"Idee",gage:9000,nk:nkLeer(),nkAlt:4000,anmerkung:""},
 {vid:8, datum:"2027-12-06",titel:"Der gestiefelte Kater",sparte:"Kindertheater",agentur:"Horizont",status:"optioniert",gage:9000,nk:nkLeer(),nkAlt:2000,anmerkung:"2. Vorstellung am 07.12.2027"},
 {vid:9, datum:"2027-12-11",titel:"Weihnachten in Prag",sparte:"Schauspiel",agentur:"BOW",status:"optioniert",gage:8500,nk:nkLeer(),nkAlt:2000,anmerkung:""},
 {vid:11,datum:"2028-01-08",titel:"Neujahrskonzert / Symphoniekonzert",sparte:"Symphoniekonzert",agentur:"",status:"optioniert",gage:10000,nk:nkLeer(),nkAlt:1000,anmerkung:"Altliste: '3. Symphoniekonzert' – Nummerierung prüfen"},
 {vid:13,datum:"2028-01-20",titel:"Brodas",sparte:"Musik/Show",agentur:"Landgraf",status:"optioniert",gage:11000,nk:nkLeer(),nkAlt:3000,anmerkung:"lt. Altliste: fragwürdig wg. anderer Städte"},
 {vid:14,datum:"2028-02-09",titel:"Der Videobeweis",sparte:"Schauspiel",agentur:"Berlin",status:"optioniert",gage:9000,nk:nkLeer(),nkAlt:2000,anmerkung:""},
 {vid:15,datum:"2028-02-12",titel:"2. Kammerkonzert",sparte:"Kammerkonzert",agentur:"",status:"Idee",gage:6000,nk:nkLeer(),nkAlt:2000,anmerkung:""},
 {vid:16,datum:"2028-02-14",titel:"Meister Eder (Pumuckl)",sparte:"Kindertheater",agentur:"Cocomico",status:"optioniert",gage:8000,nk:nkLeer(),nkAlt:0,anmerkung:"2. Vorstellung Dienstag?"},
 {vid:17,datum:"2028-03-09",titel:"Kardinalfehler",sparte:"Schauspiel",agentur:"Landgraf",status:"optioniert",gage:9000,nk:nkLeer(),nkAlt:1500,anmerkung:""},
 {vid:18,datum:"2028-03-17",titel:"53 Sonntage",sparte:"Komödie",agentur:"Berlin",status:"optioniert",gage:10100,nk:nkLeer(),nkAlt:1900,anmerkung:"Altliste: Betrag 10.100 € notiert – prüfen"},
 {vid:19,datum:"2028-03-18",titel:"3. Kammerkonzert",sparte:"Kammerkonzert",agentur:"",status:"Idee",gage:6000,nk:nkLeer(),nkAlt:2000,anmerkung:""},
 {vid:20,datum:"2028-04-01",titel:"3. Symphoniekonzert",sparte:"Symphoniekonzert",agentur:"",status:"optioniert",gage:10000,nk:nkLeer(),nkAlt:1000,anmerkung:"Nummerierung prüfen (s. 08.01.2028)"},
 {vid:21,datum:"2028-04-07",titel:"Alle 7 Wellen",sparte:"Komödie",agentur:"Hamburger Kammerspiele",status:"optioniert",gage:6500,nk:nkLeer(),nkAlt:2500,anmerkung:""},
 {vid:22,datum:"2028-05-04",titel:"Vier Männer im Nebel",sparte:"Komödie",agentur:"Umbreit",status:"Idee",gage:9000,nk:nkLeer(),nkAlt:4000,anmerkung:""},
 {vid:23,datum:"2028-05-06",titel:"Die Große Zeit",sparte:"Schauspiel",agentur:"BOW",status:"optioniert",gage:15000,nk:nkLeer(),nkAlt:6000,anmerkung:""}
];

/* ================= ZENTRALE SPEICHERUNG (Supabase) ================= */
const SYNC_URL = "https://cmisspajmbkuthhlncgd.supabase.co";
const SYNC_KEY = "sb_publishable_884ULDr2kvptTTh8CyVX4g_afzMzT2Q";
const PLAN_ID  = "kts-spielplan-2728";

const SPEICHER = "kts_spielplan_2728_v1";
const cloudAktiv = () => SYNC_URL !== "" && SYNC_KEY !== "";
let syncVersion = 0;
let syncDirty = false;
let syncTimer = null, syncLaeuft = false;

let daten = ladeLokal();
function frischeDaten(){
  return { veranstaltungen: JSON.parse(JSON.stringify(START_VA)),
    budgetJahr1: 90000, budgetJahr2: 100000, sponsoren: 5000, uebertrag: 38000,
    saisonAktuell: "2027/28", saisons: {}, naechsteVid: 24 };
}
function ladeLokal(){
  let roh = null;
  try{ roh = localStorage.getItem(SPEICHER); }catch(e){}
  if(roh){
    try{
      const obj = JSON.parse(roh);
      if(obj && obj.__cache){ syncVersion = obj.version||0; syncDirty = !!obj.dirty; return obj.daten; }
      return obj;
    }catch(e){
      try{ localStorage.setItem(SPEICHER+"_defekt_"+Date.now(), roh); }catch(_){}
      return frischeDaten();
    }
  }
  return frischeDaten();
}
function migriere(){
  /* läuft nach jedem Laden – lokal wie vom Server (deckt auch die Vorgänger-Version ab) */
  if(!daten.veranstaltungen) daten.veranstaltungen = [];
  if(daten.budgetJahr1===undefined) daten.budgetJahr1 = (daten.budget2027!==undefined ? +daten.budget2027 : 90000);
  if(daten.budgetJahr2===undefined) daten.budgetJahr2 = (daten.budget2028!==undefined ? +daten.budget2028 : 100000);
  delete daten.budget2027; delete daten.budget2028;
  if(daten.sponsoren===undefined) daten.sponsoren = 5000;
  if(daten.uebertrag===undefined) daten.uebertrag = 38000;
  if(!daten.saisonAktuell) daten.saisonAktuell = "2027/28";
  if(!daten.saisons) daten.saisons = {};
  daten.veranstaltungen.forEach(v=>{
    if(!v.nk) v.nk = nkLeer();
    NK_ARTEN.forEach(([k])=>{ if(v.nk[k]===undefined) v.nk[k]=0; });
    if(v.neben!==undefined){ v.nkAlt = (+v.neben||0) + (+v.nkAlt||0); delete v.neben; }
    if(v.nkAlt===undefined) v.nkAlt = 0;
  });
  if(!daten.naechsteVid) daten.naechsteVid = daten.veranstaltungen.reduce((m,v)=>Math.max(m, v.vid||0), 0) + 1;
  if(!daten.analyse) daten.analyse = {};
}
migriere();

function speichern(){
  if(cloudAktiv()) syncDirty = true;
  lokalSichern();
  if(cloudAktiv()){
    clearTimeout(syncTimer);
    syncTimer = setTimeout(pushServer, 800);
    syncStatus("speichert…","gelb");
  }
}
function lokalSichern(){
  try{
    const alt = localStorage.getItem(SPEICHER);
    const neu = JSON.stringify(daten);
    if(alt){
      let altDaten = alt;
      try{ const o = JSON.parse(alt); altDaten = JSON.stringify(o && o.__cache ? o.daten : o); }catch(_){}
      if(altDaten !== neu) localStorage.setItem(SPEICHER+"_prev", altDaten);
    }
    localStorage.setItem(SPEICHER, JSON.stringify({__cache:true, version:syncVersion, dirty:syncDirty, daten:daten}));
  }catch(e){}
}

/* ---------- Anmeldung (gemeinsamer Team-Zugang, wie Mediaplaner) ---------- */
const AUTH_EMAIL = "team@kts-singen.de";
const AUTH_SPEICHER = SPEICHER + "_auth";

function authSession(){
  try{
    const s = JSON.parse(localStorage.getItem(AUTH_SPEICHER));
    if(s && s.access_token) return s;
  }catch(e){}
  return null;
}
function authSpeichern(tok){
  try{ localStorage.setItem(AUTH_SPEICHER, JSON.stringify({access_token:tok.access_token,
    refresh_token:tok.refresh_token, expires_at: Date.now() + ((tok.expires_in||3600)-60)*1000})); }catch(e){}
}
function abmelden(){
  if(!cloudAktiv()){ alert("Kein Server eingetragen – keine Anmeldung aktiv."); return; }
  if(!confirm("Anmeldung auf diesem Rechner aufheben? Beim nächsten Öffnen wird wieder das Team-Passwort gebraucht.")) return;
  try{ localStorage.removeItem(AUTH_SPEICHER); }catch(e){}
  location.reload();
}
async function anmelden(passwort){
  const r = await fetch(SYNC_URL + "/auth/v1/token?grant_type=password", {method:"POST",
    headers:{"apikey":SYNC_KEY, "Content-Type":"application/json"},
    body: JSON.stringify({email:AUTH_EMAIL, password:passwort})});
  if(!r.ok) return false;
  authSpeichern(await r.json());
  return true;
}
async function tokenErneuern(){
  const s = authSession();
  if(!s || !s.refresh_token) return false;
  try{
    const r = await fetch(SYNC_URL + "/auth/v1/token?grant_type=refresh_token", {method:"POST",
      headers:{"apikey":SYNC_KEY, "Content-Type":"application/json"},
      body: JSON.stringify({refresh_token:s.refresh_token})});
    if(!r.ok) return false;
    authSpeichern(await r.json());
    return true;
  }catch(e){ return false; }
}
function loginZeigen(){
  syncStatus("Anmeldung erforderlich","gelb");
  if(document.getElementById("loginOverlay")) return;
  const o = document.createElement("div");
  o.id = "loginOverlay";
  o.style.cssText = "position:fixed;inset:0;z-index:2000;background:var(--text);display:flex;align-items:center;justify-content:center;";
  o.innerHTML = '<div style="background:#fff;border-radius:12px;padding:28px 30px;max-width:380px;width:92%;box-shadow:0 10px 40px rgba(0,0,0,.4);">'
    + '<h3 style="margin:0 0 6px;font-size:18px;">KTS Singen · Spielplan 27/28</h3>'
    + '<p style="margin:0 0 14px;color:var(--grau);font-size:14px;">Bitte das Team-Passwort eingeben (dasselbe wie beim Mediaplaner). Der Browser merkt sich die Anmeldung auf diesem Rechner.</p>'
    + '<input type="password" id="loginPw" style="width:100%;padding:10px;border:1px solid var(--rand);border-radius:8px;font-size:16px;" placeholder="Team-Passwort" autocomplete="current-password">'
    + '<div id="loginFehler" style="color:var(--rot);font-size:13px;min-height:18px;margin:6px 0;"></div>'
    + '<button class="aktion" style="width:100%;" onclick="loginVersuch()">Anmelden</button></div>';
  document.body.appendChild(o);
  const pw = document.getElementById("loginPw");
  pw.addEventListener("keydown", e => { if(e.key === "Enter") loginVersuch(); });
  pw.focus();
}
async function loginVersuch(){
  const pw = document.getElementById("loginPw").value;
  const f = document.getElementById("loginFehler");
  if(!pw){ f.textContent = "Bitte Passwort eingeben."; return; }
  f.textContent = "prüfe…";
  let ok = false;
  try{ ok = await anmelden(pw); }catch(e){}
  if(ok){
    const o = document.getElementById("loginOverlay"); if(o) o.remove();
    initCloud();
  } else {
    f.textContent = "Passwort falsch oder keine Verbindung zum Server.";
  }
}
async function sbFetch(pfad, opt){
  opt = opt || {};
  let s = authSession();
  if(s && Date.now() > s.expires_at){ await tokenErneuern(); s = authSession(); }
  opt.headers = Object.assign({"apikey":SYNC_KEY,
    "Authorization":"Bearer " + (s ? s.access_token : SYNC_KEY),
    "Content-Type":"application/json"}, opt.headers||{});
  let r = await fetch(SYNC_URL + "/rest/v1/" + pfad, opt);
  if((r.status === 401 || r.status === 403) && s){
    if(await tokenErneuern()){
      const s2 = authSession();
      opt.headers["Authorization"] = "Bearer " + s2.access_token;
      r = await fetch(SYNC_URL + "/rest/v1/" + pfad, opt);
    }
    if(r.status === 401 || r.status === 403){
      try{ localStorage.removeItem(AUTH_SPEICHER); }catch(e){}
      loginZeigen();
    }
  }
  return r;
}
async function initCloud(){
  if(!cloudAktiv()){ syncStatus("nur lokal – kein Server eingetragen","grau"); return; }
  if(!authSession()){ loginZeigen(); return; }
  syncStatus("lade…","gelb");
  try{
    const r = await sbFetch("mediaplan?id=eq."+PLAN_ID+"&select=daten,version");
    if(!r.ok) throw new Error(r.status);
    const rows = await r.json();
    if(rows.length===0){
      const c = await sbFetch("mediaplan", {method:"POST", headers:{"Prefer":"return=representation"},
        body: JSON.stringify({id:PLAN_ID, version:1, daten:daten})});
      if(!c.ok) throw new Error(c.status);
      syncVersion = 1; syncDirty = false; lokalSichern();
      syncStatus("synchron ✓","gruen");
    } else {
      const srv = rows[0];
      if(syncDirty && syncVersion === srv.version){
        syncStatus("sende offene Änderungen…","gelb");
        await pushServer();
      } else if(syncDirty && syncVersion !== srv.version){
        konfliktBanner(srv);
      } else {
        daten = srv.daten; syncVersion = srv.version; syncDirty = false; migriere(); lokalSichern();
        neuZeichnen(); syncStatus("synchron ✓","gruen");
      }
    }
  }catch(e){
    syncStatus("offline – Änderungen lokal gepuffert","rot");
  }
  if(!window.__pollLaeuft){ window.__pollLaeuft = true; setInterval(pollServer, 60000); }
}
async function pushServer(){
  if(!cloudAktiv() || syncLaeuft) return;
  syncLaeuft = true;
  try{
    const neu = syncVersion + 1;
    const r = await sbFetch("mediaplan?id=eq."+PLAN_ID+"&version=eq."+syncVersion,
      {method:"PATCH", headers:{"Prefer":"return=representation"},
       body: JSON.stringify({daten:daten, version:neu, updated_at:new Date().toISOString()})});
    if(!r.ok) throw new Error(r.status);
    const rows = await r.json();
    if(rows.length===0){
      const g = await sbFetch("mediaplan?id=eq."+PLAN_ID+"&select=daten,version");
      const srvRows = g.ok ? await g.json() : [];
      if(srvRows.length) konfliktBanner(srvRows[0]);
      else syncStatus("Fehler beim Speichern","rot");
    } else {
      syncVersion = neu; syncDirty = false; lokalSichern();
      syncStatus("synchron ✓","gruen");
    }
  }catch(e){
    syncStatus("offline – Änderungen lokal gepuffert","rot");
  }
  syncLaeuft = false;
}
async function pollServer(){
  if(!cloudAktiv() || syncDirty || syncLaeuft) return;
  try{
    const r = await sbFetch("mediaplan?id=eq."+PLAN_ID+"&select=daten,version");
    if(!r.ok) return;
    const rows = await r.json();
    if(rows.length && rows[0].version > syncVersion){
      daten = rows[0].daten; syncVersion = rows[0].version; migriere(); lokalSichern();
      neuZeichnen(); syncStatus("aktualisiert – neuer Stand übernommen ✓","gruen");
    }
  }catch(e){}
}
function neuZeichnen(){
  const dlg = document.getElementById("vaDialog");
  if(dlg && dlg.open) return;
  kopfzeile();
  zeigeTab(aktuellerTab);
}
function kopfzeile(){
  const kopf = document.querySelector("header .saison");
  if(kopf) kopf.textContent = "Saison " + daten.saisonAktuell + " · Programmplanung";
}
function syncStatus(text, farbe){
  const el = document.getElementById("syncStatus"); if(!el) return;
  el.textContent = "● " + text;
  el.style.color = {gruen:"#9fdca7", gelb:"#ffd98e", rot:"#ffb3ad", grau:"#cfd4da"}[farbe] || "#cfd4da";

function konfliktBanner(srv){
  syncStatus("Konflikt – bitte entscheiden","rot");
  window.__konfliktServer = srv;
  let b = document.getElementById("konfliktBanner");
  if(b) b.remove();
  b = document.createElement("div");
  b.id = "konfliktBanner";
  b.style.cssText = "position:fixed;top:0;left:0;right:0;z-index:1000;background:var(--rot-hell);border-bottom:3px solid var(--rot);padding:12px 20px;font-size:15px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;";
  b.innerHTML = '<b>⚠ Gleichzeitige Änderung:</b> Jemand anderes hat zwischenzeitlich gespeichert. ' +
    '<button class="aktion klein" onclick="konfliktServerNehmen()">Dessen Stand übernehmen (meine letzte Änderung verwerfen)</button> ' +
    '<button class="aktion sekundaer klein" onclick="konfliktMeinsErzwingen()">Meinen Stand durchsetzen (dessen Änderung überschreiben)</button>';
  document.body.appendChild(b);
}
function konfliktServerNehmen(){
  const srv = window.__konfliktServer; if(!srv) return;
  daten = srv.daten; syncVersion = srv.version; syncDirty = false; migriere(); lokalSichern();
  const b = document.getElementById("konfliktBanner"); if(b) b.remove();
  const dlg = document.getElementById("vaDialog"); if(dlg && dlg.open) dlg.close();
  kopfzeile(); zeigeTab(aktuellerTab);
  syncStatus("synchron ✓","gruen");
}
async function konfliktMeinsErzwingen(){
  const srv = window.__konfliktServer; if(!srv) return;
  syncVersion = srv.version;
  syncDirty = true; lokalSichern();
  const b = document.getElementById("konfliktBanner"); if(b) b.remove();
  await pushServer();
}

/* ================= HILFEN ================= */
const euro = n => (Math.round(n)).toLocaleString("de-DE") + " €";
const datumDE = iso => { if(!iso) return "–"; const [j,m,t] = iso.split("-"); return t+"."+m+"."+j; };
const nkSumme = v => NK_ARTEN.reduce((a,[k])=>a+(+v.nk[k]||0),0) + (+v.nkAlt||0);
const gesamt = v => (+v.gage||0) + nkSumme(v);
const zaehltBudget = v => v.status !== "abgesagt";
function gesamtBudget(){ return (+daten.budgetJahr1||0)+(+daten.budgetJahr2||0)+(+daten.sponsoren||0)+(+daten.uebertrag||0); }
function verplant(){ return daten.veranstaltungen.filter(zaehltBudget).reduce((a,v)=>a+gesamt(v),0); }
function statusKlasse(s){ return s ? "s"+s : "sohne"; }
function statusText(s){ return s || "ohne Status"; }
function sortiert(){ return daten.veranstaltungen.slice().sort((a,b)=>(a.datum||"9999").localeCompare(b.datum||"9999")); }

function warnungen(){
  const w = [];
  const frei = gesamtBudget() - verplant();
  if(frei < 0) w.push({art:"rot", text:"Budget überzogen um <b>"+euro(-frei)+"</b> – Positionen absagen, verhandeln oder Budget erhöhen."});
  const tage = {};
  daten.veranstaltungen.filter(v=>v.status!=="abgesagt" && v.datum).forEach(v=>{ (tage[v.datum]=tage[v.datum]||[]).push(v); });
  Object.entries(tage).filter(([d,l])=>l.length>1).sort().forEach(([d,l])=>{
    w.push({art:"gelb", text:"<b>"+datumDE(d)+":</b> "+l.length+" Veranstaltungen am selben Tag ("+l.map(v=>v.titel).join(", ")+") – Überschneidung prüfen."});
  });
  const ohneStatus = daten.veranstaltungen.filter(v=>!v.status);
  if(ohneStatus.length>0) w.push({art:"gelb", text:ohneStatus.length+" Veranstaltung(en) ohne Status: "+ohneStatus.map(v=>v.titel).join(", ")+"."});
  const ohneDatum = daten.veranstaltungen.filter(v=>!v.datum);
  if(ohneDatum.length>0) w.push({art:"gelb", text:ohneDatum.length+" Veranstaltung(en) ohne Datum: "+ohneDatum.map(v=>v.titel).join(", ")+"."});
  const pauschal = daten.veranstaltungen.filter(v=>(+v.nkAlt||0)>0);
  if(pauschal.length>0) w.push({art:"gelb", text:pauschal.length+" Veranstaltung(en) mit unaufgeschlüsselter Nebenkosten-Pauschale – nach und nach auf Tantiemen, Transfer usw. verteilen."});
  return w;
}
function warnungenHTML(){
  const w = warnungen();
  if(w.length===0) return '<div class="hinweis">Keine Warnungen – Budget im Rahmen, keine Terminkollisionen, alle Angaben vollständig.</div>';
  return w.map(x=>`<div class="${x.art==="rot"?"rotbox":"warnbox"}">${x.text}</div>`).join("");
}

  ({uebersicht:zeigeUebersicht, plan:zeigePlan, kalender:zeigeKalender, auswertung:zeigeAuswertung, analyse:zeigeAnalyse})[tab]();

}
function budgetFeld(feld, wert){

}
function budgetAendern(feld, wert){
  daten[feld] = Math.max(0, +wert||0);
  speichern(); zeigeUebersicht();
}
function zeigeUebersicht(){
  const gb = gesamtBudget(), vp = verplant(), frei = gb - vp;
  const proStatus = {};
  STATI.forEach(s=>proStatus[s]={summe:0, anzahl:0});
  proStatus["ohne"] = {summe:0, anzahl:0};
  daten.veranstaltungen.forEach(v=>{
    const k = v.status || "ohne";
    if(!proStatus[k]) proStatus[k]={summe:0,anzahl:0};
    proStatus[k].summe += gesamt(v); proStatus[k].anzahl++;
  });
  const proSparte = {};
  SPARTEN.forEach(s=>proSparte[s]={summe:0, anzahl:0});
  daten.veranstaltungen.filter(zaehltBudget).forEach(v=>{
    if(!proSparte[v.sparte]) proSparte[v.sparte]={summe:0,anzahl:0};
    proSparte[v.sparte].summe += gesamt(v); proSparte[v.sparte].anzahl++;
  });
  const maxSparte = Math.max(1, ...Object.values(proSparte).map(x=>x.summe));
  const nkArten = {};
  NK_ARTEN.forEach(([k,l])=>nkArten[k]=0);
  let nkPauschal = 0;
  daten.veranstaltungen.filter(zaehltBudget).forEach(v=>{
    NK_ARTEN.forEach(([k])=>{ nkArten[k] += (+v.nk[k]||0); });
    nkPauschal += (+v.nkAlt||0);
  });
  const maxNk = Math.max(1, ...Object.values(nkArten), nkPauschal);
  const anzahlAktiv = daten.veranstaltungen.filter(zaehltBudget).length;
  document.getElementById("inhalt").innerHTML = `
    <h2>Budget-Übersicht Saison ${daten.saisonAktuell}</h2>
    <div class="karten">
      <div class="karte"><div class="wert">${budgetFeld("budgetJahr1", +daten.budgetJahr1||0)}</div><div class="label">Budget 2026 (änderbar)</div></div>
      <div class="karte"><div class="wert">${budgetFeld("budgetJahr2", +daten.budgetJahr2||0)}</div><div class="label">Budget 2027 (änderbar)</div></div>
      <div class="karte"><div class="wert">${budgetFeld("sponsoren", +daten.sponsoren||0)}</div><div class="label">Sponsoreneinnahmen (änderbar)</div></div>
      <div class="karte"><div class="wert">${budgetFeld("uebertrag", +daten.uebertrag||0)}</div><div class="label">Übertrag aus anderen Bereichen (änderbar)</div></div>
    </div>
    <div class="karten">
      <div class="karte"><div class="wert">${euro(gb)}</div><div class="label">Gesamtbudget Saison ${daten.saisonAktuell}</div></div>
      <div class="karte"><div class="wert">${euro(vp)}</div><div class="label">Bereits verplant (ohne „abgesagt") · ${anzahlAktiv} Veranstaltungen</div></div>
      <div class="karte" style="${frei<0?"border-color:var(--rot);background:var(--rot-hell)":""}"><div class="wert" style="${frei<0?"color:var(--rot)":""}">${euro(frei)}</div><div class="label">${frei<0?"BUDGET ÜBERZOGEN":"Noch freies Budget"}</div></div>
    </div>
    <h3>Warnungen</h3>
    ${warnungenHTML()}
    <h3>Nach Status</h3>
    <table><tr><th>Status</th><th>Anzahl</th><th>Summe</th></tr>
      ${STATI.concat(["ohne"]).filter(s=>proStatus[s] && proStatus[s].anzahl>0).map(s=>`<tr>
        <td><span class="pille ${s==="ohne"?"sohne":"s"+s}">${s==="ohne"?"ohne Status":s}</span></td>
        <td>${proStatus[s].anzahl}</td><td>${euro(proStatus[s].summe)}</td></tr>`).join("")}
    </table>
    <h3>Nach Sparte (ohne „abgesagt")</h3>
    ${SPARTEN.filter(s=>proSparte[s].anzahl>0).map(s=>`
      <div class="balkenzeile"><div class="bname">${s} (${proSparte[s].anzahl})</div>
      <div class="balken"><div style="width:${Math.round(proSparte[s].summe/maxSparte*100)}%"></div></div>
      <div class="bwert">${euro(proSparte[s].summe)}</div></div>`).join("")}
    <h3>Nebenkosten nach Art (ohne „abgesagt")</h3>
    ${NK_ARTEN.map(([k,l])=>`
      <div class="balkenzeile"><div class="bname">${l}</div>
      <div class="balken"><div style="width:${Math.round(nkArten[k]/maxNk*100)}%"></div></div>
      <div class="bwert">${euro(nkArten[k])}</div></div>`).join("")}
    ${nkPauschal>0?`<div class="balkenzeile"><div class="bname" style="color:var(--gelb)">Pauschale (alt)</div>
      <div class="balken"><div style="width:${Math.round(nkPauschal/maxNk*100)}%;background:var(--gelb)"></div></div>
      <div class="bwert">${euro(nkPauschal)}</div></div>`:""}
    <p class="fussnote">Budgetfelder direkt anklicken und ändern – alles andere rechnet automatisch. Datenstand wird zentral gespeichert und gilt für das ganze Team.</p>`;
}

function zeigePlan(filterStatus, filterSparte){
  const selStatus = filterStatus||"", selSparte = filterSparte||"";
  let liste = sortiert();
  if(selStatus==="ohne") liste = liste.filter(v=>!v.status);
  else if(selStatus) liste = liste.filter(v=>v.status===selStatus);
  if(selSparte) liste = liste.filter(v=>v.sparte===selSparte);
  const summe = liste.filter(zaehltBudget).reduce((a,v)=>a+gesamt(v),0);
  let zeilen = "", letztesJahr = null;
  liste.forEach(v=>{
    const jahr = v.datum ? v.datum.slice(0,4) : "ohne Datum";
    if(jahr !== letztesJahr){
      zeilen += `<tr class="jahrtrenner"><td colspan="8">▸ ${jahr==="ohne Datum"?"OHNE DATUM":jahr}</td></tr>`;
      letztesJahr = jahr;
    }
    zeilen += `<tr class="klickbar ${v.status==="abgesagt"?"zAbgesagt":""}" onclick="vaDialogOeffnen(${v.vid})">
      <td>${datumDE(v.datum)}</td>
      <td><b>${v.titel||"–"}</b>${v.anmerkung?`<div class="fussnote">${v.anmerkung}</div>`:""}</td>
      <td>${v.sparte||""}</td><td>${v.agentur||""}</td>
      <td><span class="pille ${statusKlasse(v.status)}">${statusText(v.status)}</span></td>
      <td>${euro(+v.gage||0)}</td>
      <td>${euro(nkSumme(v))}${(+v.nkAlt||0)>0?'<div class="fussnote">davon Pauschale: '+euro(+v.nkAlt)+'</div>':""}</td>
      <td><b>${euro(gesamt(v))}</b></td></tr>`;
  });
  document.getElementById("inhalt").innerHTML = `
    <h2>Spielplan ${daten.saisonAktuell} – Planung</h2>
    <div class="leiste">
      <button class="aktion" onclick="vaDialogOeffnen(null)">+ Neue Veranstaltung</button>
      <select onchange="zeigePlan(this.value, '${selSparte}')">
        <option value="">Alle Status</option>
        ${STATI.map(s=>`<option ${selStatus===s?"selected":""}>${s}</option>`).join("")}
        <option value="ohne" ${selStatus==="ohne"?"selected":""}>ohne Status</option>
      </select>
      <select onchange="zeigePlan('${selStatus}', this.value)">
        <option value="">Alle Sparten</option>
        ${SPARTEN.map(s=>`<option ${selSparte===s?"selected":""}>${s}</option>`).join("")}
      </select>
      <span class="fussnote">${liste.length} Veranstaltungen · budgetwirksam ${euro(summe)} · Zeile anklicken zum Bearbeiten</span>
    </div>
    <table><tr><th>Datum</th><th>Titel</th><th>Sparte</th><th>Agentur / Tournee</th><th>Status</th><th>Gage</th><th>Nebenkosten</th><th>Gesamt</th></tr>
    ${zeilen}
    </table>`;
}

let kalMonat = null;
function zeigeKalender(){
  if(!kalMonat){
    const termine = sortiert().filter(v=>v.datum);
    const heute = new Date().toISOString().slice(0,10);
    const naechster = termine.find(v=>v.datum>=heute);
    kalMonat = (naechster ? naechster.datum : (termine[0]?termine[0].datum:heute)).slice(0,7);
  }
  const [J,M] = kalMonat.split("-").map(Number);
  const monatsname = new Date(J, M-1, 1).toLocaleDateString("de-DE",{month:"long",year:"numeric"});
  const startWt = (new Date(J, M-1, 1).getDay()+6)%7;
  const tageImMonat = new Date(J, M, 0).getDate();
  const heuteIso = new Date().toISOString().slice(0,10);
  const proTag = {};
  daten.veranstaltungen.filter(v=>v.datum && v.status!=="abgesagt").forEach(v=>{ (proTag[v.datum]=proTag[v.datum]||[]).push(v); });
  const zellen = [];
  for(let i=0;i<startWt;i++) zellen.push('<div class="kaltag kalleer"></div>');
  for(let t=1;t<=tageImMonat;t++){
    const iso = kalMonat+"-"+String(t).padStart(2,"0");
    const heutigen = proTag[iso]||[];
    let inhalt = `<div class="kalnum">${t}</div>`;
    heutigen.forEach(v=>{
      inhalt += `<div class="kalitem ${statusKlasse(v.status)}" onclick="event.stopPropagation();vaDialogOeffnen(${v.vid})">${v.titel}</div>`;
    });
    const kollision = heutigen.length>1 ? " kalkollision" : "";
    zellen.push(`<div class="kaltag${iso===heuteIso?" kalheute":""}${kollision}">${inhalt}</div>`);
  }
  const anzahlMonat = daten.veranstaltungen.filter(v=>v.datum && v.datum.slice(0,7)===kalMonat).length;
  document.getElementById("inhalt").innerHTML = `
    <h2>Saisonkalender</h2>
    <div class="leiste">
      <button class="aktion sekundaer klein" onclick="kalNav(-1)">← Vormonat</button>
      <b style="min-width:170px;text-align:center;font-size:17px">${monatsname}</b>
      <button class="aktion sekundaer klein" onclick="kalNav(1)">Folgemonat →</button>
      <button class="aktion sekundaer klein" onclick="kalMonat=null;zeigeKalender()">Zum nächsten Termin</button>
      <span class="fussnote">${anzahlMonat} Veranstaltung(en) in diesem Monat · Eintrag anklicken zum Bearbeiten</span>
    </div>
    <div class="kal">
      ${["Mo","Di","Mi","Do","Fr","Sa","So"].map(w=>`<div class="kalwt">${w}</div>`).join("")}
      ${zellen.join("")}
    </div>
    <p class="fussnote">Farben nach Status: grün gebucht, magenta optioniert, gelb angefragt, grau Idee. <b>Rot umrandete Tage = mehrere Veranstaltungen am selben Tag.</b> Abgesagte werden nicht angezeigt.</p>`;
}
function kalNav(delta){
  const [J,M] = kalMonat.split("-").map(Number);
  const d = new Date(J, M-1+delta, 1);
  kalMonat = d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");
  zeigeKalender();
}

/* ================= AUSWERTUNG (Saisonvergleich) ================= */
function kennzahlen(vas){
  const aktiv = vas.filter(zaehltBudget);
  const k = { anzahl: aktiv.length, gage: 0, nk: 0, nkArten: {}, gesamt: 0, sparten: {} };
  NK_ARTEN.forEach(([key])=>k.nkArten[key]=0);

    k.nk += nkSumme(v);

    if(!k.sparten[v.sparte]) k.sparten[v.sparte]={anzahl:0,summe:0};
    k.sparten[v.sparte].anzahl++; k.sparten[v.sparte].summe += gesamt(v);
  });
  k.oGage = k.anzahl>0 ? k.gage/k.anzahl : 0;

function deltaZelle(alt, neu, istGeld){
  if(alt===0 && neu===0) return "<td>–</td><td>–</td>";
  const d = neu - alt;
  const proz = alt>0 ? (d/alt*100) : null;
  const kl = d>0 ? "plus" : (d<0 ? "minus" : "");
  const wert = istGeld===false ? (d>0?"+":"")+Math.round(d) : (d>0?"+":"")+Math.round(d).toLocaleString("de-DE")+" €";
  return `<td class="${kl}">${wert}</td><td class="${kl}">${proz===null?"neu":(proz>0?"+":"")+proz.toFixed(1).replace(".",",")+" %"}</td>`;
}

const KAT_MIX = [0.30,0.30,0.25,0.15];
function wirtschaft(v){
  const a = analyseVon(v);
  const brutto = a.preise.reduce((s,p,i)=>s+(+p||0)*KAT_MIX[i],0);
  const eff = brutto * (+a.faktor||0.75);
  const tickets = Math.round((+a.plaetze||0) * (+a.auslastung||0) / 100);
  const erloes = Math.round(tickets * eff);
  const kosten = gesamt(v);
  const be = eff>0 && a.plaetze>0 ? Math.round(kosten/eff/(+a.plaetze)*100) : null;
  return {eff, tickets, erloes, kosten, ergebnis: erloes-kosten, breakeven: be};
}
function analyseAendern(vid, feld, wert, idx){
  const v = daten.veranstaltungen.find(x=>x.vid===vid); if(!v) return;
  const a = analyseVon(v);
  if(feld==="preis") a.preise[idx] = Math.max(0, +wert||0);
  else if(feld==="sv") a.sv = !!wert;
  else if(feld==="faktor") a.faktor = Math.min(1, Math.max(0.3, +String(wert).replace(",",".")||0.75));
  else a[feld] = Math.max(0, +wert||0);
  speichern(); zeigeAnalyse();
}
function saisonBilanz(){
  const aktiv = daten.veranstaltungen.filter(zaehltBudget);
  let erloes=0, kosten=0, ungeklaert=0;
  const delta = pp => aktiv.reduce((s,v)=>{
    const a=analyseVon(v);
    const brutto=a.preise.reduce((x,p,i)=>x+(+p||0)*KAT_MIX[i],0)*(+a.faktor||0.75);
    return s+Math.round((+a.plaetze||0)*Math.min(100,Math.max(0,(+a.auslastung||0)+pp))/100*brutto);
  },0);
  aktiv.forEach(v=>{
    const w = wirtschaft(v);
    erloes += w.erloes; kosten += w.kosten;
    if(analyseVon(v).rolle==="UNGEKLÄRT") ungeklaert++;
  });
  return {erloes, kosten, ergebnis: erloes-kosten, worst: delta(-10)-kosten, best: delta(10)-kosten, ungeklaert};
}

      </div>
      <div class="araster">
        <div class="afeld">Plätze eingerichtet<br><input type="number" value="${a.plaetze}" onchange="analyseAendern(${v.vid},'plaetze',this.value)"> <span class="fussnote">max 1123</span></div>
        <div class="afeld">Erwartete Auslastung<br><input type="number" value="${a.auslastung}" onchange="analyseAendern(${v.vid},'auslastung',this.value)"> %</div>

      </div>
    </div>`;
  }).join("");
  document.getElementById("inhalt").innerHTML = `

    <h3>Saisonbilanz (Ticketerlöse vs. Gagen + Nebenkosten)</h3>
    <div class="karten">
      <div class="karte"><div class="wert">${euro(b.kosten)}</div><div class="label">Produktionskosten (ohne „abgesagt")</div></div>
      <div class="karte"><div class="wert">${euro(b.erloes)}</div><div class="label">Erwartete Ticketerlöse</div></div>
      <div class="karte" style="${b.ergebnis<0?"border-color:var(--rot);background:var(--rot-hell)":""}"><div class="wert ${b.ergebnis>=0?"ergGewinn":"ergVerlust"}">${b.ergebnis>=0?"+":""}${euro(b.ergebnis)}</div><div class="label">Erwartetes Saisonergebnis</div></div>
      <div class="karte"><div class="wert" style="font-size:19px">${euro(b.worst)} / ${euro(b.best)}</div><div class="label">Spanne: alle −10 / +10 Punkte Auslastung</div></div>
    </div>
    <div class="warnbox">Diese Rechnung vergleicht nur Ticketerlöse mit Gagen und Nebenkosten – Hauskosten (Personal, Technik, Energie) und Marketing sind nicht enthalten. ${b.ungeklaert>0?`<b>${b.ungeklaert} Produktion(en) stehen ohne Gage in der Bilanz</b> – das tatsächliche Risiko liegt um schätzungsweise 25.000–35.000 € höher.`:""} Ein moderates Saison-Defizit ist bei diesem Auftrag kein Versagen: Fitzek und Neujahrskonzert finanzieren die Imagetreiber quer – das ist die Währung „Aufmerksamkeit", von der du sprichst, nur ehrlich beziffert.</div>
    <h3>Hebel zur Ergebnisverbesserung bei Verlust-Produktionen</h3>
    <div class="hinweis"><b>1. Gagenmodell wandeln:</b> Bei teuren Wagnissen (Techno Ballet) Festgage in Sockel + Einnahmenbeteiligung umverhandeln – verlagert Risiko zum Veranstalter-Partner, der an seine Zugkraft glaubt. <b>2. Zweitvorstellungen:</b> Wo die Anreise bezahlt ist, kostet die zweite Vorstellung fast nichts (Pumuckl-Dienstag fixieren ≈ +3.500 €; bei Kinderproduktionen Schulvormittage). <b>3. Förderung &amp; Sponsoring:</b> Junge Formate (Techno, Brodas) sind förderfähig – Landesprogramme BW für zeitgenössische Formate, Kulturstiftungen, lokale Banken/Industrie als Format-Paten (realistisch 5.000–10.000 € pro Saison). <b>4. Nebenkosten drücken:</b> Übernachtung/Catering über lokale Partner gegen Sichtbarkeit – bei den großen NK-Pauschalen sind 10–20 % drin. <b>5. Cross-Selling:</b> Ofczarek-Kombiticket (Prag + Große Zeit, −15 %) bindet Freiverkauf früh; Kombi 4/6 in jede Kampagne. <b>6. B2B &amp; Gruppen:</b> Firmenkontingente an Singener Industrie, Schulen für Der Sohn/Videobeweis, Vereine für Brodas. <b>7. Raummodularität:</b> Lieber klein einrichten und ausverkauft melden als groß und halb leer – „ausverkauft" ist Marketing für die Folgesaison. <b>8. Kammerkonzerte ehrlich führen:</b> Zuschuss ist Kulturauftrag – Ziel ist Deckelung (max. ~3.500 €/Konzert), nicht Break-even-Illusion.</div>

function vaDialogOeffnen(vid){
  const d = document.getElementById("vaDialog");
  document.getElementById("vdSparte").innerHTML = SPARTEN.map(s=>`<option>${s}</option>`).join("");
  document.getElementById("vdNkRaster").innerHTML = NK_ARTEN.map(([k,l])=>
    `<div class="feld"><label>${l}</label><input type="number" id="vdNk_${k}" min="0" step="50" oninput="vdSummeAktualisieren()"></div>`).join("");
  let v = null;
  if(vid!==null && vid!==undefined){
    v = daten.veranstaltungen.find(x=>x.vid===vid); if(!v) return;
    document.getElementById("vdTitel").textContent = "Veranstaltung bearbeiten";
    document.getElementById("vdId").value = vid;
    document.getElementById("vdDatum").value = v.datum||"";
    document.getElementById("vdStatus").value = v.status||"";
    document.getElementById("vdTitelFeld").value = v.titel||"";
    document.getElementById("vdSparte").value = v.sparte||"Sonstiges";
    document.getElementById("vdAgentur").value = v.agentur||"";
    document.getElementById("vdGage").value = v.gage||0;
    NK_ARTEN.forEach(([k])=>{ document.getElementById("vdNk_"+k).value = v.nk[k]||0; });
    document.getElementById("vdNkAlt").value = v.nkAlt||0;
    document.getElementById("vdAnmerkung").value = v.anmerkung||"";
    document.getElementById("vdLoeschen").style.display = "";
  }else{
    document.getElementById("vdTitel").textContent = "Neue Veranstaltung";
    document.getElementById("vdId").value = "";
    document.getElementById("vdDatum").value = "";
    document.getElementById("vdStatus").value = "Idee";
    document.getElementById("vdTitelFeld").value = "";
    document.getElementById("vdSparte").value = "Schauspiel";
    document.getElementById("vdAgentur").value = "";
    document.getElementById("vdGage").value = 0;
    NK_ARTEN.forEach(([k])=>{ document.getElementById("vdNk_"+k).value = 0; });
    document.getElementById("vdNkAlt").value = 0;
    document.getElementById("vdAnmerkung").value = "";
    document.getElementById("vdLoeschen").style.display = "none";
  }
  document.getElementById("vdNkAltFeld").style.display = (v && (+v.nkAlt||0)>0) ? "" : "none";
  document.getElementById("vdGage").oninput = vdSummeAktualisieren;
  document.getElementById("vdNkAlt").oninput = vdSummeAktualisieren;
  vdSummeAktualisieren();
  d.showModal();
}
function vdSummeAktualisieren(){
  const gage = +document.getElementById("vdGage").value||0;
  let nk = +document.getElementById("vdNkAlt").value||0;
  NK_ARTEN.forEach(([k])=>{ nk += +document.getElementById("vdNk_"+k).value||0; });
  document.getElementById("vdSumme").innerHTML = "Nebenkosten: <b>"+euro(nk)+"</b> · Gesamt (Gage + Nebenkosten): <b>"+euro(gage+nk)+"</b>";
}
function vaSpeichern(){
  const idRoh = document.getElementById("vdId").value;
  const nk = {};
  NK_ARTEN.forEach(([k])=>{ nk[k] = +document.getElementById("vdNk_"+k).value||0; });
  const werte = {
    datum: document.getElementById("vdDatum").value,
    status: document.getElementById("vdStatus").value,
    titel: document.getElementById("vdTitelFeld").value,
    sparte: document.getElementById("vdSparte").value,
    agentur: document.getElementById("vdAgentur").value,
    gage: +document.getElementById("vdGage").value||0,
    nk: nk,
    nkAlt: +document.getElementById("vdNkAlt").value||0,
    anmerkung: document.getElementById("vdAnmerkung").value
  };
  if(!werte.titel){ alert("Bitte einen Titel eintragen."); return; }
  if(idRoh){
    const v = daten.veranstaltungen.find(x=>x.vid===+idRoh);
    Object.assign(v, werte);
  }else{
    daten.veranstaltungen.push(Object.assign({vid:daten.naechsteVid++}, werte));
  }
  speichern();
  document.getElementById("vaDialog").close();
  zeigeTab(aktuellerTab);
}
function vaLoeschen(){
  const idRoh = document.getElementById("vdId").value; if(!idRoh) return;
  if(!confirm("Diese Veranstaltung wirklich löschen? (Tipp: 'abgesagt' behält sie sichtbar in der Liste, zählt aber nicht mehr gegen das Budget.)")) return;
  daten.veranstaltungen = daten.veranstaltungen.filter(x=>x.vid!==+idRoh);
  speichern();
  document.getElementById("vaDialog").close();
  zeigeTab(aktuellerTab);
}
